<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191D" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23501B2C'/%3E%3Cpath d='M6 22h20l1.5-11-5.7 4L16 7l-5.8 8-5.7-4L6 22Z' fill='%23D4A547'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Duke Tech Gestão</title>
    <script>
      // Aplica o tema salvo antes do React montar, para nao piscar claro. Padrao: claro.
      try {
        var t = localStorage.getItem('duke-tech-theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
